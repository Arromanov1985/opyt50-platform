name: One-time cleanup of superseded release branches
on:
  push:
    branches:
      - feature/release-0.2-interaction-finalization
    paths:
      - .github/workflows/cleanup-obsolete-branches.yml
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'Arromanov1985/opyt50-platform'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            feature/release-0.2-job-search \
            feature/release-0.2-unified-introductions \
            feature/release-0.2-application-retry \
            feature/release-0.2-relevant-matches
          do
            echo "Prune $branch"
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          done
          echo "Kept main, active Timeweb fallback 0.2.1.3, new 0.2.1.4."
