name: Academy offline media conversion
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils libreoffice-impress fonts-liberation
          python -m pip install -r requirements-dev.txt 'python-pptx>=1.0,<2'
      - name: Real audio, video, PDF and PPTX conversion
        env:
          STAZHNO_TEST_MEDIA_TOOLS: "1"
        run: python -m pytest -q tests/test_academy_conversion.py
