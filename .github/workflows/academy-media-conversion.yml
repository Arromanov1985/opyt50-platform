name: Academy offline media conversion
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils libreoffice-impress fonts-liberation
          python -m pip install -r requirements-dev.txt 'python-pptx>=1.0,<2'
      - name: Real audio, video, PDF and PPTX conversion
        env:
          STAZHNO_TEST_MEDIA_TOOLS: "1"
        run: python -m pytest -q tests/test_academy_conversion.py
