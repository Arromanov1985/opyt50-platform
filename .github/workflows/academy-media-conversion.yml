name: Academy offline media conversion
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils
          python -m pip install -r requirements-dev.txt
      - name: Real audio, video and PDF conversion
        env:
          STAZHNO_TEST_MEDIA_TOOLS: "1"
        run: python -m pytest -q tests/test_academy_conversion.py
