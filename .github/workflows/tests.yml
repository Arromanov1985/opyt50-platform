name: Python checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Compile application and all Python test scripts
        run: python -m compileall -q app scripts tests
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-postgres.txt --strict
      - name: Static Python security scan
        run: python -m bandit -r app -q -ll
      - name: Committed secret scan
        run: python scripts/secret_scan.py
      - name: Tests
        run: python -m pytest -q
      - name: Production security preflight
        env:
          OPYT50_ENV: production
          OPYT50_SECURITY_PROFILE: high
          OPYT50_PUBLIC_URL: https://stazhno.ru
          OPYT50_COOKIE_SECURE: "1"
          OPYT50_ENABLE_DOCS: "0"
          OPYT50_PREVIEW_SEED_DEMO: "0"
          OPYT50_ADMIN_MFA_MODE: hybrid
          OPYT50_ALLOWED_HOSTS: stazhno.ru,www.stazhno.ru
          DATABASE_URL: postgresql://ci@localhost/stazhno
          OPYT50_DB_SSLMODE: verify-full
        run: |
          export OPYT50_ADMIN_TOTP_SECRET="$(python -c 'import pyotp; print(pyotp.random_base32())')"
          python scripts/security_preflight.py
      - name: Browser JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/release02.js
          node --check app/static/release03.js
          node --check app/static/vacancy-wizard.js
          node --check app/static/release09-home.js
          node --check app/static/journal.js
          node --check app/static/community.js
          node --check app/static/release09-forms.js
          node --check app/static/release13-taxonomy.js
      - name: Browser dependencies
        id: browser_deps
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install chromium
      - name: Browser employer candidate comparison
        env:
          STAZHNO_COMPARISON_REVIEW_DIR: comparison-review
        run: python tests/browser_candidate_comparison_smoke.py
      - name: Upload candidate comparison visual review
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stazhno-candidate-comparison-review
          path: comparison-review/
          if-no-files-found: warn
          retention-days: 7
      - name: Browser candidate profile editing and preview
        env:
          STAZHNO_PROFILE_REVIEW_DIR: profile-review
        run: python tests/browser_profile_editor_smoke.py
      - name: Upload profile editor visual review
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stazhno-profile-review
          path: profile-review/
          if-no-files-found: warn
          retention-days: 7
      - name: Browser aggregate growth and route navigation
        env:
          STAZHNO_GROWTH_REVIEW_DIR: growth-review
        run: python tests/browser_growth_smoke.py
      - name: Upload growth visual review
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stazhno-growth-review
          path: growth-review/
          if-no-files-found: warn
          retention-days: 7
      - name: Browser mobile vacancy application smoke
        run: python tests/browser_mobile_apply_smoke.py
      - name: Browser professional community consent and messaging
        if: always() && steps.browser_deps.outcome == 'success'
        env:
          STAZHNO_COMMUNITY_REVIEW_DIR: community-review
        run: python tests/browser_community_smoke.py
      - name: Upload community visual review
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stazhno-community-review
          path: community-review/
          if-no-files-found: warn
          retention-days: 7
      - name: Capture PR visual review
        if: always() && github.event_name == 'pull_request' && steps.browser_deps.outcome == 'success'
        env:
          STAZHNO_VISUAL_REVIEW_DIR: visual-review
        run: python tests/browser_visual_review.py
      - name: Upload PR visual review
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stazhno-ux-review
          path: visual-review/
          if-no-files-found: warn
          retention-days: 7
      - name: Browser end-to-end smoke
        run: python tests/browser_smoke.py
      - name: Browser safety center smoke
        run: python tests/browser_safety_smoke.py
      - name: Browser candidate overview smoke
        run: python tests/browser_candidate_overview_smoke.py
      - name: Browser mobile invitation consent smoke
        run: python tests/browser_mobile_introduction_smoke.py
      - name: Browser editor draft and offline-save smoke
        run: python tests/browser_editor_resilience_smoke.py
      - name: Browser taxonomy autocomplete smoke
        run: python tests/browser_taxonomy_smoke.py
      - name: Browser security smoke
        run: python tests/browser_security_smoke.py
      - name: Probe Timeweb preview reachability (GET only)
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        run: python scripts/probe_timeweb_preview.py
      - name: Capture actual public Timeweb homepage (no auth)
        # Browser setup is skipped when an earlier test fails. Do not execute
        # screenshot tooling without the required Playwright installation.
        if: always() && github.event_name == 'pull_request' && steps.browser_deps.outcome == 'success'
        run: python tests/browser_timeweb_public_review.py
      - name: Upload actual public Timeweb screenshots
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stazhno-timeweb-public-review
          path: timeweb-public-review/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Timeweb preview reachability report
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stazhno-preview-reachability
          path: preview-reachability.json
          if-no-files-found: warn
          retention-days: 7
