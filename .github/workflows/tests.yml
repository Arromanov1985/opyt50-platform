name: Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q app scripts
      - name: Browser JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/release02.js
          node --check app/static/release03.js
          node --check app/static/vacancy-wizard.js
      - name: Browser dependencies
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install chromium
      - name: Browser end-to-end smoke
        run: python tests/browser_smoke.py
