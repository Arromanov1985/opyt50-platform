name: Python checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements-postgres.txt --strict
      - name: Static Python security scan
        run: python -m bandit -r app -q -ll
      - name: Tests
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q app scripts
      - name: Production security preflight
        env:
          OPYT50_ENV: production
          OPYT50_PUBLIC_URL: https://stazhno.ru
          OPYT50_COOKIE_SECURE: "1"
          OPYT50_ENABLE_DOCS: "0"
          OPYT50_PREVIEW_SEED_DEMO: "0"
          OPYT50_ADMIN_MFA_MODE: totp
          OPYT50_ALLOWED_HOSTS: stazhno.ru,www.stazhno.ru
          DATABASE_URL: postgresql://ci@localhost/stazhno
          OPYT50_DB_SSLMODE: verify-full
        run: |
          export OPYT50_ADMIN_TOTP_SECRET="$(python -c 'import pyotp; print(pyotp.random_base32())')"
          python scripts/security_preflight.py
      - name: Browser JavaScript syntax
        run: |
          node --check app/static/app.js
          node --check app/static/release02.js
          node --check app/static/release03.js
          node --check app/static/vacancy-wizard.js
          node --check app/static/release09-home.js
          node --check app/static/release09-forms.js
          node --check app/static/release13-taxonomy.js
      - name: Browser dependencies
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install chromium
      - name: Browser end-to-end smoke
        run: python tests/browser_smoke.py
      - name: Browser safety center smoke
        run: python tests/browser_safety_smoke.py
      - name: Browser candidate overview smoke
        run: python tests/browser_candidate_overview_smoke.py
      - name: Browser taxonomy autocomplete smoke
        run: python tests/browser_taxonomy_smoke.py
      - name: Browser security smoke
        run: python tests/browser_security_smoke.py
