name: Verify published STAZHNO release

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stazhno-publication-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Compare Timeweb with main
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Confirm release files and protected API
        shell: bash
        run: |
          set -euo pipefail
          attempts=1
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then attempts=8; fi
          status="unverified"
          for ((i=1; i<=attempts; i++)); do
            python scripts/probe_timeweb_preview.py > /dev/null
            if python -c 'import json, sys; p=json.load(open("preview-reachability.json", encoding="utf-8")); sys.exit(0 if p.get("release_evidence") == "frontend-and-backend-match" else 1)'; then
              status="published"
              break
            fi
            if ((i < attempts)); then sleep 45; fi
          done
          export RELEASE_CHECK_STATUS="$status"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("preview-reachability.json").read_text(encoding="utf-8"))
          status = os.environ["RELEASE_CHECK_STATUS"]
          lines = [
              "## СТАЖНО — проверка опубликованного релиза",
              f"**Результат:** {'Опубликован и совпадает' if status == 'published' else 'Публикация не подтверждена'}",
              f"**GitHub SHA:** `{os.environ['GITHUB_SHA']}`",
              f"**Timeweb:** `{report.get('preview_url', 'unknown')}`",
              "",
              "| Проверка | Результат |",
              "|---|---|",
          ]
          for name, item in report.get("deployed_assets", {}).items():
              lines.append(f"| {name} | {item.get('result', 'unknown')} |")
          lines.append(f"| HTML-версии | {report.get('index_asset_revisions', {}).get('result', 'unknown')} |")
          lines.append(f"| Журнал (все страницы) | {report.get('journal_pages', {}).get('result', 'unknown')} |")
          lines.append(f"| Защищённый API | {report.get('drafts_api', {}).get('result', 'unknown')} |")
          for name, item in report.get("backend_routes", {}).items():
              lines.append(f"| Backend {name} | {item.get('result', 'unknown')} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
          if [[ "$status" != "published" ]]; then
            echo "::error::Timeweb does not yet match this main revision. Inspect the artifact and App Platform deployment settings."
            exit 1
          fi
      - name: Save read-only verification details
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stazhno-publication-verification
          path: preview-reachability.json
          if-no-files-found: warn
          retention-days: 7
