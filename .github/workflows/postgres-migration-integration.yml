name: PostgreSQL migration integration
on:
  push:
    branches:
      - feature/postgres-02-transfer
  pull_request:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_migration
          POSTGRES_PASSWORD: ci_only_dummy_password
          POSTGRES_DB: opytno_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_migration -d opytno_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci_migration:ci_only_dummy_password@127.0.0.1:5432/opytno_migration_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt
      - name: SQLite to PostgreSQL isolated integration
        run: python -m pytest -q tests/test_postgres_real_migration.py tests/test_postgres_runtime.py
